         L390 372 L396 370 L383 398 L392 396 L376 428 L428 428
         L412 396 L421 398 L408 370 L414 372 Z"
      fill="#0b091e"
    />

    <!-- 7. FOREGROUND ROCKY CLIFF LEDGE (JUTTING FROM RIGHT) -->
    <polygon
      points="192,492 235,455 282,422 276,388 256,356 262,348 342,366 432,396 462,492"
      fill="#090718"
    />
    <polygon
      points="256,348 310,356 368,374 345,392 292,382 268,368"
      fill="url(#cliffEdgeHighlight)"
    />
    <polygon
      points="276,388 318,395 348,418 302,435 252,468 224,492 192,492 238,452 282,422"
      fill="#1b1138"
    />
    <polygon
      points="318,395 375,405 395,436 335,458 295,492 252,492 302,435 348,418"
      fill="#120b29"
    />

    <!-- 8. HOWLING WOLF SILHOUETTE ON THE CLIFF -->
    <g>
      <!-- Sleek Howling Wolf Silhouette Matching Reference -->
      <path
        d="M276 177
           C281 177, 287 182, 294 189
           C300 194, 307 198, 314 202
           C323 204, 333 209, 338 216
           L324 216
           C332 223, 342 233, 354 244
           C372 256, 394 268, 412 282
           C426 294, 436 312, 452 324
           C464 333, 478 336, 490 334
           C482 342, 468 346, 454 344
           C436 341, 420 330, 408 318
           L414 346
           L409 384
           L397 382
           L403 376
           L398 344
           L388 328
           L382 362
           L369 360
           L375 353
           L364 318
           C348 322, 334 321, 320 315
           L314 356
           L301 355
           L307 348
           L304 320
           L296 353
           L283 351
           L289 344
           L291 316
           L284 304
           L276 306
           L278 290
           L269 292
           L273 274
           L265 275
           L271 255
           L264 256
           L270 236
           L265 237
           L271 218
           L268 206
           C265 198, 265 192, 268 190
           C272 192, 277 195, 282 196
           C277 190, 273 184, 274 179
           Z"
        fill="#090718"
