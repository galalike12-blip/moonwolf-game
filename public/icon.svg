<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Clip path for inner rounded square canvas -->
    <clipPath id="innerClip">
      <rect x="20" y="20" width="472" height="472" rx="92" ry="92" />
    </clipPath>

    <clipPath id="moonClip">
      <circle cx="256" cy="236" r="158" />
    </clipPath>

    <!-- 3D Metallic Gold Outer Border Gradient -->
    <linearGradient id="goldOuterRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="20%" stop-color="#facc15" />
      <stop offset="45%" stop-color="#ca8a04" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="88%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>

    <linearGradient id="goldInnerBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="35%" stop-color="#ca8a04" />
      <stop offset="70%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#fef9c3" />
    </linearGradient>

    <linearGradient id="goldArcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Night Sky Gradient -->
    <linearGradient id="nightSky" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0e1130" />
      <stop offset="40%" stop-color="#191647" />
      <stop offset="70%" stop-color="#381e78" />
      <stop offset="88%" stop-color="#7030ad" />
      <stop offset="100%" stop-color="#2e1557" />
    </linearGradient>

    <!-- Full Moon Outer Glow -->
    <radialGradient id="moonHalo" cx="50%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="82%" stop-color="#c084fc" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3b1d70" stop-opacity="0" />
    </radialGradient>

    <!-- Full Moon Base Surface -->
    <radialGradient id="moonSurface" cx="42%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#fffef7" />
      <stop offset="45%" stop-color="#fef2c4" />
      <stop offset="78%" stop-color="#fcd480" />
      <stop offset="95%" stop-color="#f5b041" />
      <stop offset="100%" stop-color="#e59424" />
    </radialGradient>

    <radialGradient id="tychoRay" cx="38%" cy="56%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="22%" stop-color="#fffbeb" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0" />
    </radialGradient>

    <!-- Mountain & Cliff Gradients -->
    <linearGradient id="mountainFar" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3d2478" />
      <stop offset="100%" stop-color="#191038" />
    </linearGradient>

    <linearGradient id="mountainMid" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#281754" />
      <stop offset="100%" stop-color="#100a26" />
    </linearGradient>

    <linearGradient id="cliffEdgeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#53358e" />
      <stop offset="45%" stop-color="#28184b" />
      <stop offset="100%" stop-color="#0b0818" />
    </linearGradient>
  </defs>

  <!-- 1. OUTER 3D METALLIC GOLD SQUIRCLE FRAME -->
  <rect x="2" y="2" width="508" height="508" rx="110" ry="110" fill="#5c3409" />
  <rect x="5" y="5" width="502" height="502" rx="107" ry="107" fill="url(#goldOuterRim)" />
  <rect x="15" y="15" width="482" height="482" rx="97" ry="97" fill="url(#goldInnerBevel)" />
  <rect x="19" y="19" width="474" height="474" rx="93" ry="93" fill="#422006" />

