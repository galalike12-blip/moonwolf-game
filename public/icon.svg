      <!-- Subtle Violet-Indigo Fur Highlights on Mane & Back -->
      <g fill="#2e1d5c" opacity="0.85">
        <path d="M278 222 C285 230, 290 240, 286 248 C282 240, 278 232, 278 222 Z" />
        <path d="M276 244 C284 254, 290 264, 285 272 C280 264, 276 254, 276 244 Z" />
        <path d="M280 268 C288 276, 294 286, 290 294 C285 286, 281 278, 280 268 Z" />
        <path d="M294 232 C302 242, 308 254, 303 262 C298 252, 294 242, 294 232 Z" />
        <path d="M302 258 C310 268, 315 278, 310 286 C305 278, 302 268, 302 258 Z" />
        <path d="M316 211 L333 215 L322 219 Z" />
        <path d="M350 245 C372 257, 392 269, 408 283 C390 273, 370 263, 348 250 Z" />
        <path d="M416 288 C430 300, 444 318, 462 328 C444 322, 428 306, 414 294 Z" />
      </g>

      <!-- Glowing Eye Slit -->
      <path d="M291 191 Q294 189 297 192 Q293 194 291 191 Z" fill="#fef08a" opacity="0.9" />
