      <circle cx="268" cy="128" r="8" fill="#d9822b" opacity="0.35" />
      <circle cx="154" cy="184" r="15" fill="#c66b1d" opacity="0.28" />
      <circle cx="218" cy="212" r="18" fill="#c66b1d" opacity="0.26" />
      <circle cx="248" cy="228" r="11" fill="#c66b1d" opacity="0.3" />
      <circle cx="356" cy="196" r="14" fill="#d9822b" opacity="0.32" />
