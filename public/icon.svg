    <rect x="20" y="20" width="472" height="472" fill="url(#nightSky)" />

    <!-- Horizon Purple Glow -->
    <ellipse cx="256" cy="390" rx="235" ry="95" fill="#9333ea" opacity="0.32" />

    <!-- Starfield (Dots & 4-Point Sparkles) -->
    <g fill="#fef9c3" opacity="0.92">
      <circle cx="62" cy="96" r="1.8" />
      <circle cx="88" cy="64" r="1.5" />
      <circle cx="118" cy="108" r="2.1" />
      <circle cx="145" cy="54" r="1.5" />
      <circle cx="176" cy="72" r="1.8" />
      <circle cx="74" cy="148" r="1.9" />
      <circle cx="52" cy="196" r="1.5" />
      <circle cx="96" cy="212" r="1.4" />
      <circle cx="348" cy="58" r="1.8" />
      <circle cx="384" cy="76" r="2.1" />
      <circle cx="422" cy="66" r="1.5" />
      <circle cx="448" cy="104" r="2" />
      <circle cx="396" cy="116" r="1.4" />
      <circle cx="456" cy="148" r="1.8" />
      <circle cx="428" cy="186" r="2.2" />
      <circle cx="464" cy="216" r="1.5" />
      <circle cx="416" cy="242" r="1.8" />
      <circle cx="444" cy="272" r="1.4" />

      <!-- 4-point Star Sparkles -->
      <path d="M70 74 L72 80 L78 82 L72 84 L70 90 L68 84 L62 82 L68 80 Z" fill="#fde047" />
      <path d="M95 162 L96.8 167 L102 168.8 L96.8 170.6 L95 175.6 L93.2 170.6 L88 168.8 L93.2 167 Z" fill="#fef08a" />
      <path d="M408 86 L409.8 91 L415 92.8 L409.8 94.6 L408 99.6 L406.2 94.6 L401 92.8 L406.2 91 Z" fill="#fde047" />
      <path d="M446 174 L447.5 178 L451.5 179.5 L447.5 181 L446 185 L444.5 181 L440.5 179.5 L444.5 178 Z" fill="#fef08a" />
