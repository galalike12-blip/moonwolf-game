      <path d="M215 288 C246 278, 280 296, 286 328 C292 356, 256 382, 222 372 C194 364, 192 300, 215 288 Z" fill="#d9822b" opacity="0.28" />
      <path d="M335 212 C365 208, 398 238, 395 275 C392 308, 358 328, 335 310 C315 295, 312 235, 335 212 Z" fill="#e59838" opacity="0.36" />

      <!-- Smaller Textured Crater Spots -->
