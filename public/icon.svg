    <!-- Bottom Foreground Framing Shadows -->
    <path d="M20 408 L95 408 L155 452 L220 492 L20 492 Z" fill="#080616" />
    <path d="M412 408 L492 408 L492 492 L385 492 Z" fill="#080616" />
  </g>
</svg>
