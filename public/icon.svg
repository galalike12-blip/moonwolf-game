      <circle cx="198" cy="256" r="8" fill="#ffffff" opacity="0.95" />
      <g stroke="#fffef2" stroke-width="2" opacity="0.55" stroke-linecap="round">
        <line x1="198" y1="256" x2="138" y2="212" />
        <line x1="198" y1="256" x2="132" y2="266" />
        <line x1="198" y1="256" x2="154" y2="326" />
        <line x1="198" y1="256" x2="254" y2="316" />
        <line x1="198" y1="256" x2="266" y2="230" />
        <line x1="198" y1="256" x2="186" y2="188" />
      </g>
